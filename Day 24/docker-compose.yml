services:
  postgres:
    image: postgres:17
    container_name: day24-warehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-day24_warehouse}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - day24_warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-day24_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  day24_warehouse_data:
