services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ecommerce_app} -d ${POSTGRES_DB:-ecommerce_warehouse}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build: .
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PROJECT_HOME: /opt/airflow/project
      PYTHONPATH: /opt/airflow/project
      DATA_DIR: /opt/airflow/project/data/sample
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ecommerce_app}:${POSTGRES_PASSWORD:-change_me}@warehouse:5432/${POSTGRES_DB:-ecommerce_warehouse}
    command:
      - bash
      - -ec
      - rm -f /opt/airflow/airflow-webserver.pid && exec airflow standalone
    ports:
      - "8080:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - ./logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m

volumes:
  airflow_home:
  postgres_data:
